name: Daily SD Desk email

on:
  schedule:
    # Weekday morning briefing (UK time) + fallback slots; --once-today prevents duplicates
    - cron: '17 7 * * 1-5'
    - cron: '41 8 * * 1-5'
    - cron: '17 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: sd-desk-main
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  daily-email:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check whether daily email already sent today
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && python -c "import daily_email, sys; sys.exit(0 if daily_email.already_sent_today() else 1)"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already sent today; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh latest LSE market data
        if: steps.gate.outputs.skip != 'true'
        run: python fetch_data.py

      - name: Send private daily email
        if: steps.gate.outputs.skip != 'true'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          T212_KEY_ID: ${{ secrets.T212_KEY_ID }}
          T212_SECRET: ${{ secrets.T212_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python daily_email.py --once-today
          else
            python daily_email.py
          fi

      - name: Record dispatch state and refreshed data
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "soylee22"
          git config user.email "leeslater1992@gmail.com"
          git add public/data/last_daily.json public/data/market_data.json public/data/market_data.js
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "daily: $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Configure GitHub Pages
        if: steps.gate.outputs.skip != 'true'
        uses: actions/configure-pages@v6

      - name: Upload static site artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          include-hidden-files: true

  deploy:
    needs: daily-email
    if: needs.daily-email.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for github-pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.total_count')
            if [ "${count:-0}" -ge 1 ]; then
              echo "Artifact github-pages visible (attempt $i)"
              exit 0
            fi
            echo "Waiting for artifact metadata (attempt $i)..."
            sleep 3
          done
          echo "::warning::Proceeding to deploy after wait timeout"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
